[project]
name = "ibkr-trader-core"
version = "0.3.16"
description = "Shariah-compliant IBKR trading bot framework with pluggable strategies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dozken" }]
requires-python = ">=3.11"
keywords = ["ibkr", "trading", "shariah", "halal", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic",
    "aiohttp",
    "eventkit",
    "exchange_calendars>=4.5",
    "fastapi",
    "httpx",
    "ib-insync",
    "mstarpy",
    "nest-asyncio",
    "numpy",
    "pandas",
    "prometheus-client",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "requests",
    "sqlalchemy",
    "uvicorn[standard]",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Repository = "https://github.com/dozken/ibkr-trader-core"
Issues = "https://github.com/dozken/ibkr-trader-core/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ibkr_core*"]
exclude = ["ibkr_core.features.ai*", "tests*"]

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Test files use compact mock setup (multiple statements per line) and
# intentional throwaway locals — idiomatic for fixtures, not real dead code.
"**/tests/*" = ["E701", "E702", "F841"]
# Alembic scaffolding.
"**/migrations/env.py" = ["E701"]
# allocator.apply() is a known passthrough stub (sizing enforced in worker for
# now); its pre-fetch local is unused until the sizing logic lands.
"**/portfolio/allocator.py" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ibkr_core"]
