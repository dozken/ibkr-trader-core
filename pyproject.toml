[project]
name = "ibkr-trader-core"
version = "0.3.31"
description = "Shariah-compliant IBKR trading bot framework with pluggable strategies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dozken" }]
requires-python = ">=3.11"
keywords = ["ibkr", "trading", "shariah", "halal", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic",
    "aiohttp",
    "eventkit",
    "exchange_calendars>=4.5",
    "fastapi",
    "httpx",
    "ib-insync",
    "mstarpy",
    "nest-asyncio",
    "numpy",
    "pandas",
    "prometheus-client",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "requests",
    "sqlalchemy",
    "uvicorn[standard]",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    # Pinned: an unpinned ruff silently picks up new default rules on release.
    "ruff==0.16.2",
]

[project.urls]
Repository = "https://github.com/dozken/ibkr-trader-core"
Issues = "https://github.com/dozken/ibkr-trader-core/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ibkr_core*"]
exclude = ["ibkr_core.features.ai*", "tests*"]

[tool.ruff.lint]
# Pinned explicitly: ruff 0.16 widened its implicit default select (adding I, UP,
# B, SIM, S, DTZ, BLE, TRY, RUF, PL, ...), which turned CI red on an unrelated
# push. Declare the set we actually enforce so a ruff upgrade can never silently
# change what lint means. Widen deliberately, never by version drift.
select = ["E4", "E7", "E9", "F", "DTZ"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Test files use compact mock setup (multiple statements per line) and
# intentional throwaway locals — idiomatic for fixtures, not real dead code.
# DTZ001: fixed literal datetimes in tests stand in for values read back from
# TIMESTAMP WITHOUT TIME ZONE columns, which really are naive — making the
# fixtures aware would misrepresent the data under test. Clock READS in tests
# (DTZ003/DTZ005) are still enforced; use ibkr_core.core.clock.
"**/tests/*" = ["E701", "E702", "F841", "DTZ001"]
# Alembic scaffolding.
"**/migrations/env.py" = ["E701"]
# allocator.apply() is a known passthrough stub (sizing enforced in worker for
# now); its pre-fetch local is unused until the sizing logic lands.
"**/portfolio/allocator.py" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ibkr_core"]
