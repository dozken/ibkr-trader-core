services:
  # Containerized IB Gateway (paper). Turnkey alternative to running TWS on the
  # host. Supply your own IBKR paper credentials in ./ibkr_core/.env. To connect
  # to a host-run TWS/Gateway instead, set IBKR_HOST=host.docker.internal.
  ib-gateway-paper:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ibkr-gateway-paper
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_ACCEPT_INCOMING: "accept"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: primary
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
    ports:
      - "127.0.0.1:5900:5900"   # VNC — for 2FA and debugging only
    # API ports NOT exposed to host — backend connects via Docker network
    volumes:
      - ib-gateway-paper-settings:/home/ibgateway/Jts

  backend:
    build:
      context: .
      dockerfile: ibkr_core/Dockerfile
    container_name: ibkr-backend
    restart: always
    env_file:
      - ./ibkr_core/.env
    environment:
      # Defaults to the containerized paper gateway. Override IBKR_HOST/IBKR_PORT
      # (e.g. IBKR_HOST=host.docker.internal, IBKR_PORT=7497) to use host TWS.
      - IBKR_HOST=${IBKR_HOST:-ib-gateway-paper}
      - IBKR_PORT=${IBKR_PORT:-4004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ibkr_trader_data:/home/trader/app/ibkr_core/data
    depends_on:
      ib-gateway-paper:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibkr-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    restart: always
    depends_on:
      - prometheus

volumes:
  ibkr_trader_data:
  ib-gateway-paper-settings:
