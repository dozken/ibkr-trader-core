name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check ibkr_core/
      - name: Smoke import
        run: |
          python -c "from ibkr_core.core.strategy import Strategy, load_strategy, get_active_strategy; print('strategy ok')"
          python -c "from ibkr_core.strategies.sma_crossover import SMACrossover; s = SMACrossover(); print(f'sma ok: {s.name}')"
      - name: Tests
        run: PYTHONPATH=. pytest ibkr_core/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install
      - name: Lint
        run: cd frontend && bunx biome check .
      - name: Typecheck
        run: cd frontend && bun run typecheck
      - name: Test
        run: cd frontend && bun run test --run
      - name: Build
        run: cd frontend && bun run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
