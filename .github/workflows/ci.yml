name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Smoke import
        run: |
          cd ${{ github.workspace }}
          python -c "from backend.core.strategy import Strategy, load_strategy, get_active_strategy; print('strategy ok')"
          python -c "from backend.strategies.sma_crossover import SMACrossover; s = SMACrossover(); print(f'sma ok: {s.name}')"
      - name: Tests
        run: |
          cd ${{ github.workspace }}
          PYTHONPATH=. pytest backend/strategies/tests -q || true
          PYTHONPATH=. pytest backend/core/tests -q || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install
      - run: cd frontend && bun run typecheck || true
