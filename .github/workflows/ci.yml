name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check ibkr_core/
      - name: Smoke import
        run: |
          python -c "from ibkr_core.core.strategy import Strategy, load_strategy, get_active_strategy; print('strategy ok')"
          python -c "from ibkr_core.strategies.sma_crossover import SMACrossover; s = SMACrossover(); print(f'sma ok: {s.name}')"
      - name: Guard per-account settings choke point
        # Trading code must read settings via load_settings(account_id) so the
        # signal path and execution path can never diverge. A bare load_settings()
        # / _load_settings() (no account_id) is config drift — fail the build.
        run: |
          if grep -rEn --include='*.py' --exclude-dir=tests '_?load_settings\([[:space:]]*\)' ibkr_core/features/trading/; then
            echo "::error::Bare load_settings()/_load_settings() in trading code — pass account_id"
            exit 1
          fi
      - name: Tests
        run: PYTHONPATH=. pytest ibkr_core/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install
      - name: Lint
        run: cd frontend && bunx biome check .
      - name: Knip (unused code/deps)
        run: cd frontend && bunx knip
      - name: Typecheck
        run: cd frontend && bun run typecheck
      - name: Test
        run: cd frontend && bun run test --run
      - name: Build
        run: cd frontend && bun run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
