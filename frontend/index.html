<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>IBKR Shariah Trader</title>
  </head>
  <body>
    <script>
      if (localStorage.theme === 'dark') document.documentElement.classList.add('dark')
      // Theme knob (see src/lib/theme.ts) — applied pre-render to avoid FOUC.
      document.documentElement.setAttribute('data-theme', 'aegov')
    </script>
    <div id="root"></div>
    <!-- Written by docker-entrypoint.sh at container start, NOT at build time,
         so the published image carries no credential. Absent under `bun dev`,
         where src/shared/routes.ts falls back to the Vite env var.
         A classic script runs before the deferred module below. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
