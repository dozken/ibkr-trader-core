[tools]
python = "3.11"
node = "22"

[env]
PYTHONPATH = "{{cwd}}"
VIRTUAL_ENV = "{{cwd}}/.venv"
_.path = ["{{cwd}}/.venv/bin"]

[tasks.backend]
description = "Run backend dev server (hot-reload)"
run = "uvicorn ibkr_core.main:app --reload --host 127.0.0.1 --port 8000"

[tasks.bot]
description = "Run trading bot with hot-reload"
run = "set -a && source ibkr_core/.env && set +a && uvicorn ibkr_core.main:app --reload --host 127.0.0.1 --port 8000"

[tasks.frontend]
description = "Run frontend dev server"
run = "cd frontend && bun run dev"

[tasks.test]
description = "Run all tests"
depends = ["test-backend", "test-frontend"]

[tasks.test-backend]
description = "Run backend tests (host-side, mirrors CI)"
run = "PYTHONPATH=. .venv/bin/pytest ibkr_core/ -q --tb=short"

[tasks.test-frontend]
description = "Run frontend tests"
run = "cd frontend && bunx vitest run"
